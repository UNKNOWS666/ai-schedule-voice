<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Schedule Voice</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 28px auto; padding: 20px; background: #f5f7fb; color: #172033; }
    h2 { margin-top: 0; }
    textarea { width: 100%; min-height: 155px; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #ccd3df; border-radius: 10px; }
    button { padding: 12px 16px; margin: 8px 5px 8px 0; border: 0; border-radius: 8px; background: #2357d6; color: white; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { color: #455266; white-space: pre-wrap; }
    .hint { color: #637083; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>🎙 AI Schedule Voice</h2>
  <p>Ucapkan permintaan jadwal dalam bahasa Indonesia.</p>
  <button id="start" type="button">Mulai bicara</button>
  <button id="stop" type="button" disabled>Berhenti</button>
  <p id="status" role="status" aria-live="polite">Siap digunakan.</p>
  <textarea id="result" placeholder="Hasil ucapan akan muncul di sini..."></textarea>
  <div>
    <button id="copy" type="button">Salin teks</button>
    <button id="send" type="button">Kirim ke AI Schedule Agent</button>
  </div>
  <p class="hint">Cara pakai: klik Mulai bicara, ucapkan jadwalmu, klik Berhenti, lalu klik Kirim ke AI Schedule Agent. Halaman ini perlu dibuka melalui tombol Bicara di aplikasi utama agar teks bisa dikirim kembali.</p>

  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const copyBtn = document.getElementById('copy');
    const sendBtn = document.getElementById('send');
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (!SpeechAPI) {
      statusEl.textContent = 'Browser ini belum mendukung pengenalan suara. Coba Chrome versi terbaru.';
      startBtn.disabled = true;
    } else {
      recognition = new SpeechAPI();
      recognition.lang = 'id-ID';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent = 'Mendengarkan… silakan bicara.';
      };

      recognition.onresult = (event) => {
        let text = '';
        for (let i = 0; i < event.results.length; i++) {
          text += event.results[i][0].transcript + ' ';
        }
        resultEl.value = text.trim();
      };

      recognition.onerror = (event) => {
        statusEl.textContent = 'Pengenalan suara gagal (' + event.error + '). Periksa izin mikrofon dan koneksi internet.';
      };

      recognition.onend = () => {
        isListening = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        if (resultEl.value.trim()) {
          statusEl.textContent = 'Selesai. Periksa teks, lalu klik “Kirim ke AI Schedule Agent”.';
        }
      };

      startBtn.addEventListener('click', () => {
        try {
          if (isListening) return;
          resultEl.value = '';
          recognition.start();
        } catch (error) {
          statusEl.textContent = 'Mikrofon belum bisa dimulai. Muat ulang halaman lalu coba lagi.';
        }
      });

      stopBtn.addEventListener('click', () => {
        if (recognition && isListening) recognition.stop();
      });
    }

    copyBtn.addEventListener('click', async () => {
      const text = resultEl.value.trim();
      if (!text) {
        statusEl.textContent = 'Belum ada teks untuk disalin.';
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = 'Teks berhasil disalin.';
      } catch (error) {
        resultEl.focus();
        resultEl.select();
        statusEl.textContent = 'Teks dipilih. Tekan Ctrl+C untuk menyalin.';
      }
    });

    sendBtn.addEventListener('click', () => {
      const text = resultEl.value.trim();
      if (!text) {
        statusEl.textContent = 'Ucapkan permintaan terlebih dahulu.';
        return;
      }
      if (!window.opener || window.opener.closed) {
        statusEl.textContent = 'Tidak terhubung ke aplikasi utama. Tutup halaman ini lalu buka kembali melalui tombol Bicara di AI Schedule Agent.';
        return;
      }
      try {
        window.opener.postMessage({ type: 'AI_SCHEDULE_VOICE_RESULT', text: text }, '*');
        statusEl.textContent = 'Teks dikirim. Kembali ke tab AI Schedule Agent.';
      } catch (error) {
        statusEl.textContent = 'Gagal mengirim teks. Buka kembali halaman ini melalui tombol Bicara di aplikasi utama.';
      }
    });
  </script>
</body>
</html>
