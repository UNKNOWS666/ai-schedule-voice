<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Schedule Voice</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 28px auto; padding: 20px; background: #f5f7fb; color: #172033; }
    h2 { margin-top: 0; }
    textarea { width: 100%; min-height: 155px; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #ccd3df; border-radius: 10px; }
    button { padding: 12px 16px; margin: 8px 5px 8px 0; border: 0; border-radius: 8px; background: #2357d6; color: white; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { color: #455266; white-space: pre-wrap; }
    .hint { color: #637083; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>🎙 AI Schedule Voice</h2>
  <p id="intro">Ucapkan permintaan jadwal dalam bahasa Indonesia.</p>
  <button id="start" type="button">Mulai bicara</button>
  <button id="stop" type="button" disabled>Berhenti</button>
  <p id="status" role="status" aria-live="polite">Siap digunakan.</p>
  <textarea id="result" placeholder="Hasil ucapan akan muncul di sini..."></textarea>
  <div>
    <button id="copy" type="button">Salin teks</button>
    <button id="send" type="button">Kirim ke AI Schedule Agent</button>
  </div>
  <p class="hint" id="hint">Jika dibuka dari AI Schedule Agent, mikrofon akan mulai otomatis. Setelah selesai bicara, teks dikirim kembali dan jendela ini menutup sendiri.</p>

  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const copyBtn = document.getElementById('copy');
    const sendBtn = document.getElementById('send');
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    const autoMode = new URLSearchParams(window.location.search).get('autostart') === '1';
    let recognition = null;
    let isListening = false;
    let silenceTimer = null;
    let speechError = false;
    let sent = false;

    function sendToParent() {
      if (sent) return;
      const text = resultEl.value.trim();
      if (!text) {
        statusEl.textContent = 'Belum ada ucapan yang terbaca. Tutup jendela ini dan tekan Bicara lagi.';
        return;
      }
      if (!window.opener || window.opener.closed) {
        statusEl.textContent = 'Aplikasi utama tidak terhubung. Buka halaman ini dari tombol Bicara di AI Schedule Agent.';
        return;
      }
      try {
        window.opener.postMessage({ type: 'AI_SCHEDULE_VOICE_RESULT', text }, '*');
        sent = true;
        statusEl.textContent = 'Teks terkirim. Kembali ke AI Schedule Agent…';
        startBtn.disabled = true;
        stopBtn.disabled = true;
        sendBtn.disabled = true;
        setTimeout(() => window.close(), 350);
      } catch (error) {
        statusEl.textContent = 'Gagal mengirim teks. Salin teks atau coba lagi.';
      }
    }

    function startListening() {
      if (!recognition || isListening) return;
      speechError = false;
      resultEl.value = '';
      try {
        recognition.start();
      } catch (error) {
        statusEl.textContent = 'Browser tidak dapat memulai mikrofon otomatis. Tekan Mulai bicara untuk mencoba.';
      }
    }

    if (!SpeechAPI) {
      statusEl.textContent = 'Browser ini belum mendukung pengenalan suara. Coba Chrome versi terbaru.';
      startBtn.disabled = true;
    } else {
      recognition = new SpeechAPI();
      recognition.lang = 'id-ID';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent = 'Mendengarkan… ucapkan permintaan jadwalmu.';
      };

      recognition.onresult = (event) => {
        let text = '';
        for (let i = 0; i < event.results.length; i++) {
          text += event.results[i][0].transcript + ' ';
        }
        resultEl.value = text.trim();
        if (autoMode && resultEl.value) {
          clearTimeout(silenceTimer);
          // Setelah sekitar 2,8 detik tanpa hasil suara baru, selesaikan transkripsi otomatis.
          silenceTimer = setTimeout(() => {
            if (recognition && isListening) recognition.stop();
          }, 2800);
        }
      };

      recognition.onerror = (event) => {
        speechError = true;
        statusEl.textContent = 'Pengenalan suara gagal (' + event.error + '). Periksa izin mikrofon dan koneksi internet, lalu tekan Mulai bicara.';
      };

      recognition.onend = () => {
        isListening = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        clearTimeout(silenceTimer);
        if (autoMode && resultEl.value.trim() && !speechError) {
          sendToParent();
        } else if (resultEl.value.trim()) {
          statusEl.textContent = 'Selesai. Periksa teks; gunakan tombol Kirim jika ingin mengirimnya.';
        } else if (autoMode && !speechError) {
          statusEl.textContent = 'Belum ada ucapan yang terbaca. Tekan Mulai bicara untuk mencoba lagi.';
        }
      };

      startBtn.addEventListener('click', () => {
        if (isListening) return;
        resultEl.value = '';
        startListening();
      });
      stopBtn.addEventListener('click', () => {
        clearTimeout(silenceTimer);
        if (recognition && isListening) recognition.stop();
      });
    }

    copyBtn.addEventListener('click', async () => {
      const text = resultEl.value.trim();
      if (!text) { statusEl.textContent = 'Belum ada teks untuk disalin.'; return; }
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = 'Teks berhasil disalin.';
      } catch (error) {
        resultEl.focus(); resultEl.select();
        statusEl.textContent = 'Teks dipilih. Tekan Ctrl+C untuk menyalin.';
      }
    });

    sendBtn.addEventListener('click', sendToParent);

    // Saat dibuka dari tombol Bicara aplikasi utama, coba mulai otomatis.
    if (autoMode && SpeechAPI) {
      document.getElementById('intro').textContent = 'Mikrofon akan mulai otomatis. Ucapkan permintaanmu; setelah jeda singkat, teks dikirim kembali.';
      startBtn.textContent = 'Coba mulai bicara';
      sendBtn.textContent = 'Kirim sekarang';
      setTimeout(startListening, 450);
    }
  </script>
</body>
</html>
